<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Melting Point Chronicles</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a2d;
        --panel-2: #182540;
        --text: #e5edf9;
        --muted: #9bb0d1;
        --folder: #ffd166;
        --file: #7dd3fc;
        --border: rgba(255, 255, 255, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0b1020 0%, #111827 100%);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .repo-view {
        width: min(820px, 92vw);
        background: rgba(18, 26, 45, 0.92);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.38);
        padding: 28px 26px 24px;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(1.5rem, 2vw, 2.2rem);
        letter-spacing: 0.02em;
      }

      .repo-tree {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px 14px 10px;
      }

      ul {
        list-style: none;
        margin: 0;
        padding-left: 1.2rem;
      }

      .tree-root {
        padding-left: 0;
      }

      li {
        position: relative;
        margin: 6px 0;
        line-height: 1.65;
      }

      li::before {
        content: "";
        position: absolute;
        left: -13px;
        top: 0.75em;
        width: 10px;
        height: 1px;
        background: rgba(255,255,255,0.28);
      }

      .folder > .name,
      .file > .name {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 6px;
        padding: 2px 6px;
      }

      .folder > .name::before {
        content: "📁";
      }

      .file > .name::before {
        content: "📄";
      }

      .folder > .name {
        color: var(--folder);
        font-weight: 700;
      }

      .file > .name {
        color: var(--file);
      }

      .meta {
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main class="repo-view">
      <h1>🔥 Melting Point Chronicles</h1>

      <div class="repo-tree" aria-label="Repository structure">
        <ul class="tree-root">
          <li class="folder">
            <span class="name">melting-point-chronicles</span>
            <ul>
              <li class="file"><span class="name">.gitignore</span></li>
              <li class="file"><span class="name">LICENSE</span></li>
              <li class="file"><span class="name">Master mind</span></li>
              <li class="file"><span class="name">README.md</span></li>
              <li class="file"><span class="name">index.html</span></li>
            </ul>
          </li>
        </ul>
      </div>

      <div class="meta">Repository structure for the current GitHub repo.</div>
    </main>
  </body>
</html>
